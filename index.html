<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="claude:viewport-fit-sides" content="cover">
<title>Побег из лаборатории Фёдора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: one narrow stage, one room at a time. The only glowing object is the test tube. */
:root{
  --bg:#0B0E1A; --surface:#141830; --surface-2:#1B2040; --line:#2A3158;
  --fg:#F2F3FA; --muted:#A3A9C9;
  --violet:#8B5CF6; --violet-deep:#6D3FE0; --gold:#FFD166;
  --green:#5BD08A; --brown:#A0652F; --red:#FF8A8A; --grid:rgba(139,92,246,.07);
  --font-display:'Unbounded','Arial Black','Segoe UI Black',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background-color:var(--bg); color:var(--fg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  font:500 16px/1.55 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(28px,6.4vw,50px)}
h2{font-size:clamp(24px,5vw,36px);margin-bottom:16px}
h3{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);margin:22px 0 10px;font-family:var(--font-body);font-weight:800}
p{margin:0}
sub,sup{font-size:.68em;line-height:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.brand{font:600 13px var(--font-display);letter-spacing:.02em;color:var(--muted)}
.hud{display:flex;align-items:center;gap:16px}
.locks{display:flex;gap:8px}
.lockico{color:var(--muted);display:flex}
.lockico .sh{transition:transform .5s;transform-origin:16px 11px}
.lockico.open{color:var(--gold)}
.lockico.open .sh{transform:translateY(-3px) rotate(-28deg)}
.errs{font-size:14px;font-weight:700;color:var(--muted)}
.errs b{color:var(--fg);font-variant-numeric:tabular-nums}

.eyebrow{font:800 13px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--violet);margin-bottom:10px}
.lead{font-size:18px;color:var(--muted);max-width:60ch;margin:16px 0 22px}

.bubble{display:flex;gap:14px;align-items:flex-start;background:var(--surface-2);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 22px;max-width:70ch}
.ava{flex:none;width:40px;height:40px;border-radius:50%;background:var(--violet-deep);display:flex;align-items:center;justify-content:center;font:600 18px var(--font-display);color:#fff}
.bubble p{padding-top:6px;min-width:0}

.btn{font:800 16px var(--font-body);padding:13px 24px;min-height:48px;border-radius:12px;border:0;background:var(--violet-deep);color:#fff;cursor:pointer}
.btn:hover:not(:disabled){background:var(--violet)}
.btn.gold{background:var(--gold);color:#1B1530}
.btn.gold:hover:not(:disabled){background:#FFE08F}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pill{border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:700;color:var(--muted)}

/* hero */
.hero{display:block}

/* test tube */
.tube-wrap{display:flex;flex-direction:column;align-items:center;gap:0}
.rim{width:112px;height:8px;border-radius:8px;background:rgba(255,255,255,.5)}
.tube{--glow:rgba(139,92,246,.55);position:relative;width:96px;height:230px;border:3px solid rgba(255,255,255,.45);border-top:0;border-radius:0 0 48px 48px;overflow:hidden;background:rgba(255,255,255,.05);box-shadow:0 0 40px var(--glow);transition:box-shadow 1.6s}
.tube::after{content:"";position:absolute;left:12px;top:12px;bottom:36px;width:8px;border-radius:8px;background:rgba(255,255,255,.14)}
.liquid{position:absolute;left:0;right:0;bottom:0;height:76%;background:#7B2FF2;transition:background 1.6s ease}
.liquid::after{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:rgba(255,255,255,.2)}
.sediment{position:absolute;left:0;right:0;bottom:0;height:0;background:#7A4A1F;transition:height 2.4s ease}
.tlabel{margin-top:12px;font-size:14px;font-weight:700;color:var(--muted);text-align:center;min-height:44px;max-width:170px}

/* room 1 */
.lab{display:grid;grid-template-columns:170px 1fr;gap:28px;align-items:start}
@media(max-width:600px){.lab{grid-template-columns:1fr}.lab .tube-wrap{justify-self:center}}
.ctrl{min-width:0}
.ctrl h3:first-child{margin-top:0}
.bottles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.bottle{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--fg);font:inherit;cursor:pointer}
.bottle:hover{border-color:var(--violet)}
.bottle[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,209,102,.1)}
.bf{font:600 18px var(--font-display)}
.bn{font-size:14px;color:var(--muted);font-weight:700}
.logs{display:grid;gap:8px}
.logrow{border:2px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:15px}
.logrow.done{border-style:solid;background:var(--surface);color:var(--fg)}
.logrow .eq{margin-top:4px;color:var(--muted);font-size:15px}
.lockbox{margin-top:28px;border:2px solid var(--gold);border-radius:16px;padding:20px;background:var(--surface)}
.lockbox.shake,.opt.shake,.cnode.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.code{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}
.code label{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}
.code input{width:64px;height:64px;text-align:center;font:600 28px var(--font-display);border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.c0{background:#E8EBF5}.c1{background:var(--brown)}.c2{background:var(--green)}
.msg{min-height:24px;margin-top:12px;font-size:15px;font-weight:700;color:var(--red)}
.msg.ok{color:var(--green)}

/* room 2 */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:8px}
.rule{display:flex;gap:10px;align-items:center;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px}
.rule .rf{font:600 17px var(--font-display);color:var(--gold)}
.qcount{font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:26px}
.mol{display:flex;align-items:flex-start;justify-content:center;gap:8px;padding:30px 4px 18px;font:600 clamp(22px,5.4vw,36px) var(--font-display);flex-wrap:nowrap}
.half{display:flex;flex-direction:column;align-items:center;transition:transform .8s ease}
.bond{color:var(--gold);transition:opacity .4s,transform .8s}
.hc{margin-top:8px;font:800 13px var(--font-body);color:var(--muted);letter-spacing:.04em}
.mol.cut .bond{opacity:0;transform:scale(.3)}
.mol.cut .left{transform:translateX(-22px)}
.mol.cut .right{transform:translateX(22px)}
.mname{text-align:center;color:var(--muted);font-weight:700;font-size:15px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:18px}
.opt{text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--fg);font:700 16px var(--font-body);cursor:pointer;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--violet)}
.opt.bad{border-color:var(--red);opacity:.55}
.opt.good{border-color:var(--green);background:rgba(91,208,138,.14)}
.opt:disabled{cursor:default}
.why{margin-top:14px;min-height:24px;font-weight:700;color:var(--red);font-size:15px}
.why.ok{color:var(--green)}

/* room 3 */
.chain{max-width:660px;margin:8px auto 0;display:grid}
.cnode{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px}
.cnode .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cnode .nm{font:600 18px var(--font-display)}
.cnode .fm{font-weight:700;color:var(--muted)}
.cnode.unk{border-style:dashed;border-color:#5A6080}
.cnode.unk .nm{color:var(--gold)}
.cnode.final{background:var(--violet-deep);border-color:var(--violet-deep)}
.cnode.final .fm{color:#EADFFF}
.conn{display:flex;gap:14px;padding-left:30px;min-height:56px}
.conn .ln{width:3px;background:#5A6080;flex:none}
.conn .meta{padding:10px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.conn .lab2{display:flex;align-items:center;gap:10px;font-weight:800}
.num{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font:600 13px var(--font-display)}
.so{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sopt{border-radius:999px;border:2px solid var(--line);background:var(--surface-2);color:var(--fg);padding:7px 14px;font:700 15px var(--font-body);cursor:pointer}
.sopt:hover{border-color:var(--violet)}
.sopt.sel{border-color:var(--gold);background:rgba(255,209,102,.12)}
.sopt.good{border-color:var(--green);background:rgba(91,208,138,.14)}
.sopt.bad{border-color:var(--red)}
.hint{font-size:14px;font-weight:700;color:var(--red);margin-top:8px}
.safe{margin-top:26px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* finale */
.rank{border:2px solid var(--gold);border-radius:16px;padding:20px;background:var(--surface);margin:8px 0 24px}
.rank .rt{font:600 clamp(22px,5vw,32px) var(--font-display);color:var(--gold)}
.skills{display:grid;gap:10px;margin:0 0 24px;padding:0;list-style:none}
.skills li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:700}
.tick{flex:none;width:24px;height:24px;border-radius:50%;background:var(--green);color:#0B2A18;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-top:1px}
.cta{border-radius:16px;background:var(--violet-deep);padding:24px;color:#fff}
.cta h2{margin-bottom:10px}
.cta p{color:#EADFFF}
.contact{margin:16px 0;border:2px dashed rgba(255,255,255,.5);border-radius:12px;padding:12px 16px;font-weight:800;user-select:all;word-break:break-word}
.sign{margin-top:28px;color:var(--muted);font-size:14px;font-weight:700}
.sign b{color:var(--fg)}

/* room backgrounds: fixed image under a dark veil, content sits on one translucent panel */
.bg{position:fixed;inset:0;z-index:-1;background-color:var(--bg);background-size:cover;background-position:center;transition:opacity .4s}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,14,26,.28) 0%,rgba(11,14,26,.74) 100%)}
.panel{background:rgba(11,14,26,.82);border:2px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,34px)}
.brand,.sign{text-shadow:0 1px 8px rgba(0,0,0,.8)}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.cta .btn.ghost{color:#fff;border-color:rgba(255,255,255,.55)}
.cta .msg{color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<div class="wrap">
  <div class="bg" id="bg" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">ЛАБОРАТОРИЯ ФЁДОРА</div>
    <div class="hud">
      <div class="locks" aria-label="Замки">
        <span class="lockico"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path class="sh" d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
        <span class="lockico"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path class="sh" d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
        <span class="lockico"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path class="sh" d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
      </div>

  </header>
  <main id="stage" class="panel"></main>
  <p class="sign"><b>Фёдор</b> · репетитор по химии · МГУ им. М.В. Ломоносова<br>© 2026. Все права защищены.</p>
</div>

function tubeReset(){
  var l=$('#liq'),s=$('#sed'),t=$('#tube');
  l.style.transition='none';s.style.transition='none';
  l.style.background='#7B2FF2';s.style.height='0';
  t.style.setProperty('--glow','rgba(139,92,246,.55)');
  void l.offsetWidth;l.style.transition='';s.style.transition='';
  state.reacted=false;
}
function tubeReact(m){
  var l=$('#liq'),s=$('#sed'),t=$('#tube');
  if(m==='acid'){l.style.background='rgba(226,232,246,.22)';t.style.setProperty('--glow','rgba(226,232,246,.35)');}
  if(m==='alk'){l.style.background='#2FBF6B';t.style.setProperty('--glow','rgba(47,191,107,.55)');}
  if(m==='neutral'){
    l.style.background='#8A5A2B';t.style.setProperty('--glow','rgba(160,101,47,.55)');
    setTimeout(function(){l.style.background='rgba(214,196,160,.28)';s.style.height='24%';},1700);
  }
}
function updateLogs(){
  $('#logs').innerHTML=ORDER.map(function(k){
    var m=MEDIA[k];
    if(state.tested[k]){
      return '<div class="logrow done"><b>'+m.reagent+'</b> ('+m.short+') → '+m.color+'<div class="eq">Марганец превратился в: '+m.prod+'</div></div>';
    }
    return '<div class="logrow">'+m.reagent+' ('+m.short+'): опыт ещё не проведён</div>';
  }).join('');
}

  state.tested={};state.medium=null;state.reacted=false;state.r1err=0;
  stage.innerHTML=
  '<section><p class="eyebrow">Комната 1 из 3</p><h2>Хамелеон</h2>'+
  fed('Это перманганат калия, марганец в степени окисления +7. Сначала выбери среду, потом добавь восстановитель Na<sub>2</sub>SO<sub>3</sub>. Проведи все три опыта и смотри на цвет.')+
  '<div class="lab">'+
    '<div class="tube-wrap"><div class="rim"></div><div class="tube" id="tube"><div class="liquid" id="liq"></div><div class="sediment" id="sed"></div></div><p class="tlabel" id="tlabel">KMnO<sub>4</sub> · фиолетовый раствор</p></div>'+
    '<div class="ctrl">'+
      '<h3>Шаг 1. Выбери среду</h3>'+
      '<div class="bottles">'+ORDER.map(function(k){return '<button class="bottle" data-m="'+k+'" aria-pressed="false"><span class="bf">'+MEDIA[k].reagent+'</span><span class="bn">'+MEDIA[k].short+'</span></button>';}).join('')+'</div>'+
      '<h3>Шаг 2. Добавь восстановитель</h3>'+
      '<button class="btn" id="run" disabled>Добавить Na<sub>2</sub>SO<sub>3</sub></button>'+
      '<h3>Журнал опытов</h3><div class="logs" id="logs"></div>'+
    '</div>'+
  '</div><div id="lockslot"></div></section>';
  updateLogs();
  $$('.bottle').forEach(function(b){
    b.onclick=function(){
      if(state.reacted)tubeReset();
      $$('.bottle').forEach(function(x){x.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true');
      state.medium=b.getAttribute('data-m');
      $('#run').disabled=false;
      $('#tlabel').innerHTML='KMnO<sub>4</sub> + '+MEDIA[state.medium].reagent+'<br>цвет пока не изменился';
    };
  });
  $('#run').onclick=function(){
    var m=state.medium;if(!m)return;
    tubeReact(m);state.reacted=true;this.disabled=true;
    state.tested[m]=true;
    $('#tlabel').innerHTML=MEDIA[m].color;
    updateLogs();
    if(ORDER.every(function(k){return state.tested[k];})&&!$('#lockbox'))showLock1();
  };
}
function showLock1(){
  $('#lockslot').innerHTML=
  '<div class="lockbox" id="lockbox"><h3 style="margin-top:0">Замок 1</h3>'+
  '<p>На двери нарисованы три пробирки: бесцветная, бурая и зелёная. Введи, сколько электронов принимает Mn<sup>+7</sup> в каждом из этих случаев.</p>'+
  '<div class="code">'+
    '<label for="c0"><span class="dot c0"></span>бесцветный<input id="c0" inputmode="numeric" maxlength="1" autocomplete="off"></label>'+
    '<label for="c1"><span class="dot c1"></span>бурый<input id="c1" inputmode="numeric" maxlength="1" autocomplete="off"></label>'+
    '<label for="c2"><span class="dot c2"></span>зелёный<input id="c2" inputmode="numeric" maxlength="1" autocomplete="off"></label>'+
  '</div><button class="btn gold" id="open1">Открыть замок</button><div class="msg" id="m1" aria-live="polite"></div></div>';
  $('#lockbox').scrollIntoView({behavior:'smooth',block:'center'});
  ['c0','c1','c2'].forEach(function(id,i,arr){
    var el=document.getElementById(id);
    el.oninput=function(){el.value=el.value.replace(/[^0-9]/g,'').slice(0,1);if(el.value&&arr[i+1])document.getElementById(arr[i+1]).focus();};
    el.onkeydown=function(e){if(e.key==='Enter')check1();};
  });
  $('#open1').onclick=check1;
}
function check1(){
  var v=['c0','c1','c2'].map(function(id){return document.getElementById(id).value;}).join('');
  var box=$('#lockbox'),msg=$('#m1');
  if(v==='531'){
    state.unlocked=1;hud();
    box.innerHTML='<h3 style="margin-top:0">Замок 1 открыт</h3>'+fed('Щёлк! Запомни: чем кислее среда, тем больше электронов берёт марганец и тем бледнее раствор. Дальше тебя ждёт комната, где режут органические молекулы. Ха-ха-ха')+'<button class="btn gold" id="next1">В комнату 2</button>';
    $('#next1').onclick=function(){go('r2');};
    return;
  }
  state.errors++;state.r1err++;hud();shake(box);
  if(state.r1err>=4)msg.innerHTML='Mn<sup>2+</sup> это степень окисления +2, в MnO<sub>2</sub> марганец +4, в MnO<sub>4</sub><sup>2−</sup> он +6. Сколько электронов нужно, чтобы дойти от +7 до каждой?';
  else if(state.r1err>=2)msg.innerHTML='Подсказка: марганец был в степени окисления +7. Найди его степень окисления в продукте и вычти.';
  else msg.innerHTML='Не открылось. Сверь цвет пробирки с веществом из журнала опытов.';
}

/* ---------- room 2 ---------- */
var ALK=[
  {name:'бутен-2',left:'CH<sub>3</sub>–CH',right:'CH–CH<sub>3</sub>',hl:'1 H',hr:'1 H',
   res:'У каждого CH-углерода остался один H, поэтому получились две молекулы кислоты.',
   opts:[
    {t:'2 CH<sub>3</sub>COOH',ok:1},
    {t:'CH<sub>3</sub>COOH + CO<sub>2</sub>',why:'CO<sub>2</sub> получается только из группы CH<sub>2</sub>=. Здесь у обоих углеродов по одному H.'},
    {t:'CH<sub>3</sub>–CH(OH)–CH(OH)–CH<sub>3</sub>',why:'Диол образуется при мягком окислении на холоде. Здесь жёсткое: цепь рвётся.'},
    {t:'2 CH<sub>3</sub>CHO',why:'Альдегид в горячем растворе KMnO<sub>4</sub> окисляется дальше, до кислоты.'}]},
  {name:'пропен',left:'CH<sub>3</sub>–CH',right:'CH<sub>2</sub>',hl:'1 H',hr:'2 H',
   res:'Группа CH<sub>2</sub>= целиком окислилась до CO<sub>2</sub>, а CH-углерод стал кислотой.',
   opts:[
    {t:'CH<sub>3</sub>COOH + CO<sub>2</sub>',ok:1},
    {t:'2 CH<sub>3</sub>COOH',why:'У CH<sub>2</sub>= нет углеродного заместителя. От него остаётся CO<sub>2</sub>, а не кислота.'},
    {t:'CH<sub>3</sub>CHO + HCHO',why:'В жёстких условиях альдегиды доокисляются: уксусный до кислоты, формальдегид до CO<sub>2</sub>.'},
    {t:'пропандиол-1,2',why:'Диол относится к мягкому окислению в нейтральной среде.'}]},
  {name:'2-метилпропен',left:'(CH<sub>3</sub>)<sub>2</sub>C',right:'CH<sub>2</sub>',hl:'0 H',hr:'2 H',
   res:'У углерода без H кислота получиться не может, он остаётся кетоном. CH<sub>2</sub>= уходит как CO<sub>2</sub>.',
   opts:[
    {t:'(CH<sub>3</sub>)<sub>2</sub>C=O + CO<sub>2</sub>',ok:1},
    {t:'(CH<sub>3</sub>)<sub>2</sub>CH–COOH + CO<sub>2</sub>',why:'Кислота требует хотя бы одного H у углерода двойной связи. Здесь у одного из них H нет.'},
    {t:'ацетон + HCOOH',why:'Муравьиная кислота тоже окисляется перманганатом до CO<sub>2</sub>.'},
    {t:'(CH<sub>3</sub>)<sub>3</sub>C–OH',why:'Спирт не получится: связь C=C рвётся, а не присоединяет воду.'}]}
];
function rR2(){
  state.alkIdx=0;
  stage.innerHTML=
  '<section><p class="eyebrow">Комната 2 из 3</p><h2>Ножницы для двойной связи</h2>'+
  fed('Горячий подкисленный KMnO<sub>4</sub> режет связь C=C пополам. Что получится, зависит от числа атомов H у каждого из двух углеродов. Правило ниже, остальное за тобой. Сможешь выбрать правильные продукты три раза и не ошибиться?')+
  '<div class="rules">'+
   '<div class="rule"><span class="rf">CH<sub>2</sub>=</span><span>→ CO<sub>2</sub> и вода</span></div>'+
   '<div class="rule"><span class="rf">RCH=</span><span>→ RCOOH, кислота</span></div>'+
   '<div class="rule"><span class="rf">R<sub>2</sub>C=</span><span>→ R<sub>2</sub>C=O, кетон</span></div>'+
  '</div><div id="q"></div></section>';
  showAlk();
}
function showAlk(){
  var a=ALK[state.alkIdx];
  var opts=shuffle(a.opts);
  $('#q').innerHTML=
  '<p class="qcount">Молекула '+(state.alkIdx+1)+' из '+ALK.length+'</p>'+
  '<div class="mol" id="mol"><div class="half left"><span>'+a.left+'</span><span class="hc">'+a.hl+'</span></div><div class="bond">=</div><div class="half right"><span>'+a.right+'</span><span class="hc">'+a.hr+'</span></div></div>'+
  '<p class="mname">'+a.name+', кислая среда, нагревание. Что получится?</p>'+
  '<div class="opts" id="opts">'+opts.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o.t+'</button>';}).join('')+'</div>'+
  '<div class="why" id="why" aria-live="polite"></div><div id="after"></div>';
  $$('.opt').forEach(function(b){
    b.onclick=function(){
      var o=opts[+b.getAttribute('data-i')];
      if(o.ok){
        $$('.opt').forEach(function(x){x.disabled=true;});
        b.classList.add('good');
        $('#mol').classList.add('cut');
        var w=$('#why');w.className='why ok';w.innerHTML=a.res;
        if(state.alkIdx<ALK.length-1){
          $('#after').innerHTML='<button class="btn gold" id="nx" style="margin-top:16px">Следующая молекула</button>';
          $('#nx').onclick=function(){state.alkIdx++;showAlk();};
        }else{
          state.unlocked=2;hud();
          $('#after').innerHTML='<div class="lockbox">'+'<h3 style="margin-top:0">Замок 2 открыт</h3>'+fed('Чисто! Три разреза без единой кислоты в кармане. Остался сейф. Его код придётся вычислить цепочкой из пяти реакций.')+'<button class="btn gold" id="next2">К сейфу</button></div>';
          $('#next2').onclick=function(){go('r3');};
        }
      }else{
        state.errors++;hud();
        b.classList.add('bad');b.disabled=true;shake(b);
        var w2=$('#why');w2.className='why';w2.innerHTML=o.why;
      }
    };
  });
}

/* ---------- room 3 ---------- */
var CH={
  x1:{tag:'X<sub>1</sub>',hint:'Хлор на свету замещает один атом H в алкане.',opts:[{t:'хлорэтан',ok:1},{t:'1,2-дихлорэтан'},{t:'этен'},{t:'этанол'}]},
  x2:{tag:'X<sub>2</sub>',hint:'Натрий и галогеналкан: реакция Вюрца удваивает углеродную цепь.',opts:[{t:'бутан',ok:1},{t:'этан'},{t:'бутен-2'},{t:'бутанол-1'}]},
  x3:{tag:'X<sub>3</sub>',hint:'Хлорирование бутана идёт в основном по вторичному атому углерода.',opts:[{t:'2-хлорбутан',ok:1},{t:'1-хлорбутан'},{t:'бутанол-2'},{t:'1,2-дихлорбутан'}]},
  r4:{hint:'Нужно отщепить HCl и получить двойную связь: действует спиртовая щёлочь.',opts:[{t:'KOH (спирт.), t',ok:1},{t:'KOH (водн.), t'},{t:'H<sub>2</sub>SO<sub>4</sub> (конц.), t'},{t:'H<sub>2</sub>, Ni'}]},
  r5:{hint:'Нужна именно соль, а не кислота. Вспомни, в какой среде марганец уходит в зелёный.',opts:[{t:'KMnO<sub>4</sub>, KOH, t',ok:1},{t:'KMnO<sub>4</sub>, H<sub>2</sub>SO<sub>4</sub>, t'},{t:'KMnO<sub>4</sub>, H<sub>2</sub>O, 0 °C'},{t:'O<sub>2</sub>, Ni'}]}
};
function slot(key){
  return '<div class="so" data-k="'+key+'">'+state.chainOpts[key].map(function(o,i){return '<button class="sopt" data-k="'+key+'" data-i="'+i+'">'+o.t+'</button>';}).join('')+'</div><div class="hint" id="h_'+key+'"></div>';
}
function node(name,f,cls){return '<div class="cnode '+(cls||'')+'"><div class="row"><span class="nm">'+name+'</span><span class="fm">'+f+'</span></div></div>';}
function unk(key){return '<div class="cnode unk" id="n_'+key+'"><div class="row"><span class="nm">'+CH[key].tag+'</span><span class="fm">выбери вещество</span></div>'+slot(key)+'</div>';}
function conn(n,label){return '<div class="conn"><div class="ln"></div><div class="meta"><div class="lab2"><span class="num">'+n+'</span><span>'+label+'</span></div></div></div>';}
function connSel(n,key){return '<div class="conn"><div class="ln"></div><div class="meta" style="flex:1"><div class="lab2"><span class="num">'+n+'</span><span>выбери реагент и условия</span></div>'+slot(key)+'</div></div>';}
function rR3(){
  state.chain={};state.chainOpts={};
  Object.keys(CH).forEach(function(k){state.chainOpts[k]=shuffle(CH[k].opts);});
  stage.innerHTML=
  '<section><p class="eyebrow">Комната 3 из 3</p><h2>Сейф с цепочкой</h2>'+
  fed('Код от сейфа спрятан в цепочке превращений. Найди три неизвестных вещества и два реагента. Если ошибёшься, то я подскажу, где именно.')+
  '<div class="chain">'+
    node('Этан','CH<sub>3</sub>–CH<sub>3</sub>')+conn(1,'Cl<sub>2</sub>, hν')+unk('x1')+conn(2,'+ Na')+unk('x2')+conn(3,'Cl<sub>2</sub>, hν')+unk('x3')+connSel(4,'r4')+
    node('Бутен-2','CH<sub>3</sub>–CH=CH–CH<sub>3</sub>')+connSel(5,'r5')+node('Ацетат калия','CH<sub>3</sub>COOK','final')+
  '</div>'+
  '<div class="safe"><button class="btn gold" id="opens">Открыть сейф</button><div class="msg" id="m3" aria-live="polite"></div></div></section>';
  $$('.sopt').forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-k');
      state.chain[k]=+b.getAttribute('data-i');
      $$('.sopt[data-k="'+k+'"]').forEach(function(x){x.classList.remove('sel','good','bad');});
      b.classList.add('sel');
      var h=document.getElementById('h_'+k);if(h)h.textContent='';
    };
  });
  $('#opens').onclick=check3;
}
function check3(){
  var keys=Object.keys(CH),msg=$('#m3');
  var missing=keys.filter(function(k){return state.chain[k]===undefined;});
  if(missing.length){msg.className='msg';msg.textContent='Заполни все слоты: осталось '+missing.length+'.';return;}
  var wrong=[];
  keys.forEach(function(k){
    var i=state.chain[k],ok=state.chainOpts[k][i].ok;
    var btn=$('.sopt[data-k="'+k+'"][data-i="'+i+'"]');
    btn.classList.remove('sel');btn.classList.add(ok?'good':'bad');
    var h=document.getElementById('h_'+k);
    if(ok){h.textContent='';}else{wrong.push(k);h.textContent=CH[k].hint;}
  });
  if(wrong.length){
    state.errors+=wrong.length;hud();
    wrong.forEach(function(k){var n=document.getElementById('n_'+k);if(n)shake(n);});
    msg.className='msg';msg.textContent='Не открылось: неверных слотов '+wrong.length+'. Подсказки под ними.';
    wrong.forEach(function(k){delete state.chain[k];});
    return;
  }
  state.unlocked=3;hud();
  msg.className='msg ok';msg.textContent='Сейф открыт!';
  $('#opens').disabled=true;
  setTimeout(function(){go('end');},1100);
}

/* ---------- finale ---------- */
function rEnd(){
  var e=state.errors;
  var rank=e<=2?'Профессор':(e<=6?'Химик-следователь':'Лаборант-стажёр');
  var line=e<=2?'Почти без ошибок. Так решают на экзамене.':(e<=6?'Несколько промахов, и каждый ты исправил сам.':'Ошибки были, но дверь открыта, и это главное.');
  stage.innerHTML=
  '<section><p class="eyebrow">Дверь открыта</p><h1>Ты выбрался</h1>'+
  '<div style="height:16px"></div>'+
  fed('Вот это да. Знаешь, что ты сейчас сделал? Решил на практике задачи, на которых на ЕГЭ теряют баллы, и даже не заметил, что это экзамен.')+
  '<div class="rank"><p class="eyebrow" style="margin-bottom:6px">Твой ранг</p><p class="rt">'+rank+'</p><p style="color:var(--muted);margin-top:8px">Ошибок: '+e+'. '+line+'</p></div>'+
  '<h3>Что ты теперь умеешь</h3>'+
  '<ul class="skills">'+
   '<li><span class="tick">✓</span><span>Предсказывать, как пройдёт окисление в кислой, нейтральной и щелочной среде</span></li>'+
   '<li><span class="tick">✓</span><span>Понимать, как работает жёсткое окисление и куда рвётся двойная связь</span></li>'+
   '<li><span class="tick">✓</span><span>Помнить продукты восстановления перманганата: Mn<sup>2+</sup>, MnO<sub>2</sub>, MnO<sub>4</sub><sup>2−</sup></span></li>'+
   '<li><span class="tick">✓</span><span>Решать цепочки и задания 14, 24, 32 и 33 и получать дополнительные баллы к результату</span></li>'+
  '</ul>'+
  '<div class="cta"><h2>Остальные темы ЕГЭ можно пройти так же</h2><p>Расследования, квесты и реакции, которые запоминаются сами. Запишись на пробное занятие к Фёдору.</p>'+
   '<div class="contact" id="contact">ТГ: @fedor_alexeevi4</div>'+
   '<div class="ctas"><a class="btn gold" href="https://t.me/fedor_alexeevi4" target="_blank" rel="noopener">Написать в Telegram</a><button class="btn ghost" id="copy">Скопировать контакт</button><button class="btn ghost" id="again">Сыграть ещё раз</button></div><div class="msg" id="cm" aria-live="polite"></div></div>'+
  '</section>';
  $('#again').onclick=function(){state.errors=0;state.unlocked=0;go('intro');};
  $('#copy').onclick=function(){
    var t='@fedor_alexeevi4';
    try{navigator.clipboard.writeText(t).then(function(){$('#cm').textContent='Скопировано';},function(){sel();});}catch(err){sel();}
    function sel(){var r=document.createRange();r.selectNodeContents($('#contact'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);$('#cm').textContent='Выделено, скопируй вручную';}
  };
}

function render(){
  hud();
  document.getElementById('bg').style.backgroundImage='url("'+BG[state.screen]+'")';
  if(state.screen==='intro')rIntro();
  else if(state.screen==='r1')rR1();
  else if(state.screen==='r2')rR2();
  else if(state.screen==='r3')rR3();
  else rEnd();
}
render();
})();
</script>
